name: Actividad 4 · Verificación y demo

on:
  push:
    branches: [actividad-4-lolmastercraft]
  workflow_dispatch:
    inputs:
      etiqueta_revision:
        description: Etiqueta de una revisión completa (por ejemplo, a4-lolmastercraft-r2)
        required: false
        type: string

permissions:
  contents: read

env:
  ETIQUETA_INFORME: a4-lolmastercraft-r2
  CORRIDA_DE_EVIDENCIA: '45921119209'

jobs:
  evidencia:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      corrida: ${{ steps.artefacto.outputs.corrida }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar la corrida registrada en el informe
        id: artefacto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corrida="$CORRIDA_DE_EVIDENCIA"
          [[ "$corrida" =~ ^[0-9]+$ ]] || exit 0
          referencia="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$corrida")"
          if ! jq -e '.conclusion == "success" and .path == ".github/workflows/a4.yml"' <<< "$referencia" >/dev/null; then
            exit 0
          fi
          revision="$(jq -r '.head_sha' <<< "$referencia")"
          if git merge-base --is-ancestor "$revision" "$GITHUB_SHA" &&
             git diff --quiet "$revision" "$GITHUB_SHA" -- . \
                ':(exclude)docs/**' ':(exclude)README.md' ':(exclude)ai_log.md' ':(exclude).github/workflows/a4.yml'; then
            echo "corrida=$corrida" >> "$GITHUB_OUTPUT"
          fi

  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LLM_PROVIDER: fake
      EMB_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar revisión fijada del motor
        run: python -m guia.preparar_motor --descargar
      - name: Probar autenticación, revisión y agente
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidencias
          python -m pytest -q | tee evidencias/pytest.txt
      - name: Medir dos versiones con los mismos casos
        run: python -m guia.evaluar_a4 evidencias/medicion
      - uses: actions/upload-artifact@v4
        with:
          name: evaluacion-actividad-4
          path: evidencias/
          if-no-files-found: error

  demo:
    needs: [evidencia, gemini]
    if: ${{ !cancelled() && needs.evidencia.result == 'success' && needs.evidencia.outputs.corrida == '' && needs.gemini.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar interfaz y navegador
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Preparar revisión fijada
        run: python -m guia.preparar_motor --descargar
      - name: Recorrer la interfaz y grabar evidencia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini-3.1-flash-lite
          LLM_TIMEOUT: 30
          LLM_RETRIES: 2
          LLM_INTERVALO_SEG: '7'
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python -m guia.grabar_demo --gemini evidencias/demo
          else
            python -m guia.grabar_demo evidencias/demo
          fi
          ffprobe -v error -show_entries format=duration,size -of json evidencias/demo/Actividad_4_Demo.mp4
      - name: Mostrar diagnóstico de la integración
        if: failure()
        run: test ! -f evidencias/demo/servicios.log || tail -80 evidencias/demo/servicios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-interfaz-actividad-4
          path: |
            evidencias/demo/pantalla-*.png
            evidencias/demo/trazas_demo.jsonl
          if-no-files-found: warn

  gemini:
    needs: evidencia
    if: ${{ needs.evidencia.outputs.corrida == '' }}
    name: Gemini real, si está habilitado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Revisar si el proveedor está configurado
        id: proveedor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo 'activo=si' >> "$GITHUB_OUTPUT"
          else
            echo 'activo=no' >> "$GITHUB_OUTPUT"
            echo 'GEMINI_API_KEY todavía no está configurada en este repositorio.'
          fi
      - uses: actions/checkout@v4
        if: steps.proveedor.outputs.activo == 'si'
      - uses: actions/setup-python@v5
        if: steps.proveedor.outputs.activo == 'si'
        with:
          python-version: '3.12'
      - name: Preparar dependencias y motor
        if: steps.proveedor.outputs.activo == 'si'
        run: |
          python -m pip install -r requirements.txt
          python -m guia.preparar_motor --descargar
      - name: Ejecutar los casos con Gemini
        if: steps.proveedor.outputs.activo == 'si'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini-3.1-flash-lite
          LLM_TIMEOUT: 30
          LLM_RETRIES: 2
          LLM_INTERVALO_SEG: '7'
        run: python -m guia.evaluar_a4 --gemini evidencias/gemini
      - uses: actions/upload-artifact@v4
        if: steps.proveedor.outputs.activo == 'si'
        with:
          name: gemini-actividad-4
          path: evidencias/gemini/
          if-no-files-found: error

  publicar:
    needs: [verificar, evidencia, demo]
    if: ${{ !cancelled() && needs.verificar.result == 'success' && needs.evidencia.result == 'success' && (needs.evidencia.outputs.corrida != '' || needs.demo.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Identificar una entrega completa
        id: entrega
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA_SOLICITADA: ${{ inputs.etiqueta_revision }}
        run: |
          if [[ ! -f docs/Actividad_4_Informe.pdf ]]; then
            exit 0
          fi
          preparada="$ETIQUETA_INFORME"
          ENTREGA_TAG="${ETIQUETA_SOLICITADA:-$preparada}"
          if [[ ! "$ENTREGA_TAG" =~ ^a4-lolmastercraft(-r[0-9]+)?$ ]]; then
            echo '::error::La etiqueta de revisión no sigue el formato esperado.'
            exit 1
          fi
          if [[ "$ENTREGA_TAG" != "$preparada" ]]; then
            echo '::error::La etiqueta solicitada debe coincidir con la revisión del informe.'
            exit 1
          fi
          publicado="$(git ls-remote --tags origin "refs/tags/$ENTREGA_TAG" | cut -f1)"
          if [[ -n "$publicado" && "$publicado" != "$GITHUB_SHA" ]]; then
            if [[ -z "$ETIQUETA_SOLICITADA" ]]; then
              echo 'La entrega publicada queda disponible. Prepara otra etiqueta en el informe para publicar una revisión.'
              exit 0
            fi
            echo '::error::La etiqueta de revisión ya apunta a otro commit.'
            exit 1
          fi
          if gh release view "$ENTREGA_TAG" > /dev/null 2>&1; then
            echo "La publicación $ENTREGA_TAG ya está disponible."
            exit 0
          fi
          echo 'lista=si' >> "$GITHUB_OUTPUT"
          echo "etiqueta=$ENTREGA_TAG" >> "$GITHUB_OUTPUT"
      - name: Publicar etiqueta e informe
        if: steps.entrega.outputs.lista == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          ENTREGA_TAG: ${{ steps.entrega.outputs.etiqueta }}
        run: |
          gh release create "$ENTREGA_TAG" --target "$GITHUB_SHA" --title "Actividad 4 · Revisor FinNorte" --notes "Informe de LSCA2318 con los resultados de la evaluación con Gemini." docs/Actividad_4_Informe.pdf
